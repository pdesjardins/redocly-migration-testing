swagger: '2.0'
info:
  title: Kitchen API
  version: 1.0.2
  description: |
    Returns information about kitchen operations.
  contact:
    name: Toast developer support
host: toast-api-server
basePath: /kitchen/v1
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
paths:
  /export/itemFulfillments:
    get:
      operationId: itemFulfillmentsGet
      summary: Get item fulfillments
      description: |
        Exports item fulfillments for a single, specified business date.
      parameters:
        - name: businessDate
          type: string
          in: query
          description: |
            The business date for the item fulfillments to export. This  value must be in `YYYYMMDD` format.
          required: true
      responses:
        '200':
          description: |
            Returns a list of `ItemFulfillment` objects.
          schema:
            type: array
            items:
              $ref: '#/definitions/ItemFulfillment'
        '204':
          description: |
            No data is returned. The restaurant does not have an active subscription to Toast Restaurant Management Suite Pro or higher.
        '400':
          description: |
            The request is invalid.
        '401':
          description: |
            The authentication token is not recognized.
        '403':
          description: |
            The request is not permitted.
        '404':
          description: |
            The endpoint was not found.
        '500':
          description: |
            There was an unexpected server error.
      security:
        - oauth2:
            - kitchen:read
  /published/prepStations:
    get:
      operationId: prepStationsGet
      summary: Get all prep stations
      description: |
        Returns the configuration for every prep station that has been created for the specified restaurant. A prep station represents the location of a kitchen printer or KDS device that receives orders for fulfillment. You can use optional query parameters to paginate the results. If a `lastModified` date is specified, returns all objects that were created or modified after that date.<br>
        <br>
        *Related topics:*<br>
        <a href="https://doc.toasttab.com/doc/platformguide/platformKitchenRoutingOverview.html#adminRoutingToPrepStations">Routing to prep stations</a>
      parameters:
        - name: pageToken
          type: string
          in: query
          description: |
            A string that identifies the set of data objects that the 
            endpoint will return in its response data. You can use this 
            parameter to control the pagination of response data. You 
            get the value that you supply in the `pageToken` parameter 
            from the `Toast-Next-Page-Token` header field value of a 
            previous request to the endpoint. For more information, see 
            <a href="https://doc.toasttab.com/doc/devguide/apiResponseDataPagination.html">Paginating response data</a>.
        - name: lastModified
          type: string
          in: query
          description: |
            Limits the return data to objects created or modified after a specific date and time. For example: `2021-12-01T00:00:00.000+0000`.
          format: date-time
        - name: Toast-Restaurant-External-ID
          type: string
          in: header
          description: |
            The Toast platform identifier for the restaurant.
          required: true
      responses:
        '200':
          description: |
            Returns an array of `PrepStation` objects. A prep station represents the location of a kitchen printer or KDS device that receives orders for fulfillment.<br>
            *Related topics:*<br>
            <a href="https://doc.toasttab.com/doc/platformguide/platformKitchenRoutingOverview.html#adminRoutingToPrepStations">Routing to prep stations</a>
          schema:
            type: array
            minItems: 0
            maxItems: 1000
            items:
              $ref: '#/definitions/PrepStation'
          headers:
            Toast-Next-Page-Token:
              type: string
              description: |
                A string that identifies the following set of objects 
                that the endpoint will return. You can use this value 
                to control the pagination of response data. To return 
                the next page of objects you supply this value in the 
                `pageToken` parameter of the next request to the 
                endpoint. For more information, see 
                <a href="https://doc.toasttab.com/doc/devguide/apiResponseDataPagination.html">Paginating response 
                data</a>.

                The endpoint does not return the 
                `Toast-Next-Page-Token` field if there is no following 
                page of response data objects. For example, the 
                endpoint will not return a `Toast-Next-Page-Token` 
                header field if all the data objects fit in one 
                response or if you have reached the last page of 
                response objects.
      security:
        - oauth2:
            - kitchen:read
  /published/prepStations/{guid}:
    parameters:
      - name: guid
        type: string
        in: path
        required: true
    get:
      operationId: prepStationsGuidGet
      summary: Get a prep station
      description: |
        Returns the configuration for a single prep station that has been defined for the specified restaurant. A prep station represents the location of a kitchen printer or KDS device that receives orders for fulfillment.<br>
        <br>
        *Related topics:*<br>
        <a href="https://doc.toasttab.com/doc/platformguide/platformKitchenRoutingOverview.html#adminRoutingToPrepStations">Routing to prep stations</a>
      parameters:
        - name: Toast-Restaurant-External-ID
          type: string
          in: header
          description: |
            The Toast platform identifier for the restaurant.
          required: true
      responses:
        '200':
          description: |
            Returns a `PrepStation` object.
          schema:
            $ref: '#/definitions/PrepStation'
      security:
        - oauth2:
            - kitchen:read
definitions:
  ItemFulfillment:
    title: ItemFulfillment
    type: object
    description: |
      Details about the fulfillment of a menu item.
    allOf:
      - type: object
        properties:
          restaurantGuid:
            description: The unique identifier assigned to the restaurant by the Toast platform.
            type: string
            format: uuid
          orderGuid:
            description: The unique identifier assigned to the order by the Toast platform.
            type: string
            format: uuid
          selectionGuid:
            description: The unique identifier assigned to the `Selection` object, which represents an item, of an order by the Toast platform.
            type: string
            format: uuid
          selectionMenuItemGuid:
            description: The unique identifier assigned to the menu item by the Toast platform.
            type: string
            format: uuid
          selectionMenuItemName:
            description: The descriptive name for the menu item, if available.
            type: string
          selectionMenuItemMultiLocationId:
            description: A number used to identify and consolidate menu entities that are versions of each other.
            type: string
          ticketGuid:
            description: The unique identifier assigned to the kitchen ticket by the Toast platform.
            type: string
            format: uuid
          ticketFiredAt:
            description: The time and date when the ticket for the menu item was fired to the kitchen, in ISO format.
            type: string
            format: date-time
          itemFulfilledAt:
            description: The time and date when the item was fulfilled, in ISO format.
            type: string
            format: date-time
          itemStartedAt:
            description: The time and date when an employee started working on the item, in ISO format. If the restaurant is not using the start queue feature, this value is the same as the `ticketFiredAt` value.
            type: string
            format: date-time
          itemFulfillmentLevel:
            description: |
              The fulfillment level for the menu item. The values include:
                * `0`: The item was fulfilled at the prep station level. If an item has multiple prep stations, a separate `ItemFulfillment` object exists for each prep station that reaches this level.
                * `1`: The item was fulfilled at the first-level expediter.
                * `2`: The item was fulfilled at the second-level expediter. This is only used if [Two Level Fulfillment](https://doc.toasttab.com/doc/platformguide/adminKitchenDiningRoomReference.html#configTwoLevelFulfillment) is enabled.
            type: integer
          prepStationGuid:
            description: The unique identifier assigned to the prep station by the Toast platform, if available.
            type: string
            format: uuid
          prepStationName:
            description: The descriptive name of the prep station where the item was fulfilled, if available.
            type: string
          prepStationMultiLocationId:
            description: An identifier used to identify and consolidate prep station entities that are versions of each other. For more information about multi-location identifiers, see [Toast identifiers](https://doc.toasttab.com/doc/devguide/apiIdentifiers.html).
            type: string
          diningOptionGuid:
            description: The unique identifier assigned to the dining option by the Toast platform, if available.
            type: string
            format: uuid
          diningOptionName:
            description: The descriptive name of the dining option associated with the order, if available. For example, "Dine In" or "Take Out".
            type: string
          diningOptionBehavior:
            description: The behavior type of the dining option, indicating whether the order is on-premise or off-premise, if available. For example, `DINE_IN` or `TAKE_OUT`.
            type: string
          courseGuid:
            description: The unique identifier assigned to the course by the Toast platform, if available.
            type: string
            format: uuid
          courseName:
            description: The descriptive name of the course associated with the item, if available. For example, "Appetizer" or "Entree".
            type: string
          orderSource:
            description: |
              The way the order was placed.

              Valid values:

              * `In Store`
              * `Online`
              * `Order-and-Pay-at-Table`
              * `API`
              * `Kiosk`
              * `Caller Id`
              * `Google`
              * `Invoice`
              * `Toast Pickup App`
              * `Toast Local`
              * `Branded Online Ordering`
              * `Catering`
              * `Catering Online Ordering`
              * `Toast Tables`
              * `eCommerce Online ordering`
              * `Branded Mobile App`
              * `Grubhub` (deprecated)
            type: string
  PrepStation:
    title: PrepStation
    type: object
    description: |
      The configuration for a single prep station. A prep station represents the location of a kitchen printer or KDS device that receives orders for fulfillment.<br>
      <br>
      *Related topics:*<br>
      <a href="https://doc.toasttab.com/doc/platformguide/adminAddPrepStation.html">Add a prep station</a>
    allOf:
      - $ref: '#/definitions/ToastReference'
      - type: object
        properties:
          connectedPrepStations:
            type: array
            description: |
              An array of `ToastReference` objects containing the identifiers of the other prep stations that this prep station monitors.<br>
              <br>
              Allowing a prep station to monitor other prep stations makes it easier for restaurant employees to coordinate when an order includes items that are fulfilled at more than one prep station.<br>
              <br>
              *Related topics:*<br>
              <a href="https://doc.toasttab.com/doc/platformguide/adminMonitoringTicketsOtherPrepStations.html">Monitoring items at other prep stations</a><br>
              <a href="https://doc.toasttab.com/doc/platformguide/adminMonitoringTicketsOtherPrepStations.html#adminConfigurePrintOtherStationsItems">Configure printing of other stations' items</a>
            items:
              $ref: '#/definitions/ToastReference'
          printingMode:
            type: string
            description: |
              Determines whether tickets sent to this prep station are printed at the prep station's assigned printer. Values include:
              * ON: Every ticket sent to this prep station prints at the prep station's assigned printer.
              * OFFLINE_ONLY: Tickets sent to this prep station only print at the assigned printer if the prep station normally uses a KDS device for ticket display but that device is offline.          
            enum:
              - 'ON'
              - OFFLINE_ONLY
          includeWithExpediter:
            type: boolean
            description: |
              True if tickets sent to this prep station should also be sent to the printer or KDS device that has been set up for the restaurant's expediter.<br>
              <br>
              *Related topics:*<br>
              <a href="https://doc.toasttab.com/doc/platformguide/adminUsingExpo.html">Using an expediter KDS</a><br>
          expoRouting:
            type: string
            description: |
              Determines how tickets are routed to the expediter. This field works in conjunction with `includeWithExpediter` to provide more granular control over expo routing. Values include:
              * SEND_TO_EXPO: Tickets are sent to both the prep station and the expediter (equivalent to `includeWithExpediter: true`)
              * EXPO_ONLY: Tickets are sent only to the expediter, not to the prep station
              * SKIP_EXPO: Tickets are sent only to the prep station, not to the expediter (equivalent to `includeWithExpediter: false`)
              <br>
              <br>
              *Related topics:*<br>
              <a href="https://doc.toasttab.com/doc/platformguide/adminUsingExpo.html">Using an expediter KDS</a><br>
            enum:
              - SEND_TO_EXPO
              - EXPO_ONLY
              - SKIP_EXPO
          name:
            type: string
            description: The name of this prep station.
          kitchenPrinter:
            $ref: '#/definitions/ToastReference'
  ToastReference:
    type: object
    title: ToastReference
    description: |
      A wrapper object containing a Toast platform GUID.
    properties:
      guid:
        type: string
        description: |
          A Toast platform identifier for an entity.
      entityType:
        type: string
        description: |
          The type of object this is. For prep stations, `entityType` is set to `PrepStation`.
    required:
      - guid
      - entityType
securityDefinitions:
  oauth2:
    description: |
      Access to Toast APIs, specific endpoints, 
      and specific API endpoint operations is 
      controlled by the scopes that are associated 
      with your API account. 

      A full reference for Toast API scopes and 
      their capabilities can be found in the
      [_Toast Developer Guide_](https://doc.toasttab.com/doc/devguide/apiScopes.html).

      The `/kitchen/v1/export/itemFulfillments` endpoint requires an active subscription
      to <a href="https://www.toasttab.com/customers/shop/software-services/restaurant-management-suite?tier=Pro">Toast Restaurant Management Suite Pro or higher</a> 
      to retrieve the data.
    type: oauth2
    tokenUrl: https://toast-api-server/authentication/v1/authentication/login
    flow: application
    scopes:
      kitchen:read: |
        Allows reading from the kitchen API.
